name: Pipeline Full ARB Translate (Ollama kaelri/hy-mt2:1.8b)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pipeline-ollama-arb:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout 测试仓库
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Ollama 官方 CLI 与 Python SDK
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          python -m pip install ollama

      - name: 4. 启动 Ollama 服务并拉取 kaelri/hy-mt2:1.8b 模型
        run: |
          ollama serve &
          sleep 5
          echo "=== 拉取 kaelri/hy-mt2:1.8b ==="
          ollama pull kaelri/hy-mt2:1.8b

      - name: 5. 执行全量 ARB 本地化翻译管道 (Ollama)
        run: |
          python scripts/i18n_pipeline_ollama.py
