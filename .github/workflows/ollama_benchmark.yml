name: Ollama Benchmark Test

# 全仓库【唯一】允许自动 Push 触发的工作流
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ollama-benchmark-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 1. Checkout 测试仓库
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Ollama CLI 与 Python SDK
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          python -m pip install ollama

      - name: 4. 启动 Ollama 服务并预拉取 kaelri/hy-mt2:1.8b 模型
        run: |
          OLLAMA_NUM_PARALLEL=4 ollama serve &
          sleep 5
          echo "=== 正在预拉取 kaelri/hy-mt2:1.8b 模型 ==="
          ollama pull kaelri/hy-mt2:1.8b

      - name: 5. 运行并发对比基准压测
        run: |
          python scripts/benchmark_ollama.py
