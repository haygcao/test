name: Test Ollama Hy-MT2 Model (Pure YML Test)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Ollama 官方 CLI 与 Python SDK (按官方说明)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          python -m pip install ollama

      - name: 4. 启动 Ollama 服务并拉取指定模型 dzgg/Hy-MT2-1.8B-GGUF:1.25Bit
        run: |
          ollama serve &
          sleep 5
          echo "=== 拉取指定模型 dzgg/Hy-MT2-1.8B-GGUF:1.25Bit ==="
          ollama pull dzgg/Hy-MT2-1.8B-GGUF:1.25Bit

      - name: 5. 100% 按官方示例代码运行 Python 推理
        run: |
          python -c "
          from ollama import chat

          print('=== 向 Ollama 发送翻译请求 ===')
          response = chat(
              model='dzgg/Hy-MT2-1.8B-GGUF:1.25Bit',
              messages=[{'role': 'user', 'content': 'Translate to Chinese: Hello world'}]
          )
          print('=== 翻译结果 ===')
          print(response.message.content)
          "
