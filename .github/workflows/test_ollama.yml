name: Test Ollama Model (100% 遵照官方 Library 规范测试)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Ollama 官方 CLI 与 Python SDK
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          python -m pip install ollama

      - name: 4. 启动 Ollama 服务并拉取官方标准超轻量翻译模型
        run: |
          ollama serve &
          sleep 5
          echo "=== 拉取 Ollama 官方标准极速模型 qwen2.5:0.5b ==="
          ollama pull qwen2.5:0.5b

      - name: 5. 100% 按 Ollama 官方示例代码运行 Python 翻译
        run: |
          python -c "
          from ollama import chat

          print('=== 向 Ollama 发送翻译请求 ===')
          response = chat(
              model='qwen2.5:0.5b',
              messages=[{'role': 'user', 'content': 'Translate into Chinese: Hello world'}]
          )
          print('=== Ollama 官方测试翻译结果 ===')
          print(response.message.content)
          "
