name: Test Ollama Hy-MT2 Model (100% 遵照 kaelri/hy-mt2 规范)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Ollama 官方 CLI 与 Python SDK
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          python -m pip install ollama

      - name: 4. 启动 Ollama 服务并拉取 kaelri/hy-mt2:1.8b 专属适配模型
        run: |
          ollama serve &
          sleep 5
          echo "=== 拉取 Ollama 专属模板适配模型 kaelri/hy-mt2:1.8b ==="
          ollama pull kaelri/hy-mt2:1.8b

      - name: 5. 运行 Ollama 翻译测试
        run: |
          python -c "
          from ollama import chat

          print('=== 向 Ollama kaelri/hy-mt2:1.8b 发送翻译请求 ===')
          response = chat(
              model='kaelri/hy-mt2:1.8b',
              messages=[{'role': 'user', 'content': '将以下文本翻译成英语：今天天气真好。'}]
          )
          print('=== Ollama 翻译结果 ===')
          print(response.message.content)
          "
