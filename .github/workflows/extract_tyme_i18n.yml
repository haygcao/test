name: Extract tyme4dart i18n ARB Files

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-i18n:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tyme4dart i18n Extraction
        run: |
          python scripts/extract_tyme_i18n.py

      - name: Commit and Push Changes with Bot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "i18n: update extracted tyme4dart ARB files"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "l10n/"
