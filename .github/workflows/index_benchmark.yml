name: Index-Translate 2B Benchmark Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  index-benchmark-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: 1. Checkout 测试仓库
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 PyTorch 与 Transformers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.40.0" accelerate

      - name: 4. 运行 Index-Translate 2B (Qwen3.5 150+语言) 4 线程 CPU 并发基准压测
        run: |
          python scripts/benchmark_index.py
