name: Slim ARB Pipeline

# 彻底禁用 Push 触发，仅保留手动触发
on:
  workflow_dispatch:

jobs:
  slim-arb-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Git Clone HuggingFace 仓库到本地 ./hymt2_model
        run: |
          git clone https://huggingface.co/AngelSlim/HY-1.8B-2Bit ./hymt2_model

      - name: 3. Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 递归克隆 AngelSlim 源码与依赖 (--recursive)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate
          git clone --recursive https://github.com/Tencent/AngelSlim.git /tmp/AngelSlim
          cd /tmp/AngelSlim && python -m pip install -e .

      - name: 5. 执行全量 ARB 本地化翻译管道 (AngelSlim 400MB)
        run: |
          python scripts/i18n_pipeline_local.py
