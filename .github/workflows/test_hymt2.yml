name: Test AngelSlim 400MB Full i18n Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-hymt2-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout 测试仓库
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 遵照官方 README 递归克隆 AngelSlim 源码与依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate
          git clone --recursive https://github.com/Tencent/AngelSlim.git /tmp/AngelSlim
          cd /tmp/AngelSlim && python -m pip install -e .

      - name: 4. 执行 AngelSlim 400MB 端侧全量 ARB 检修与本地化翻译
        run: |
          python scripts/i18n_pipeline_local.py
