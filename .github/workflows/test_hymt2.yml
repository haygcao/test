name: Test Hy-MT2 AngelSlim Model (Pure YML Test)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-hymt2:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. 直接 git clone 克隆 HuggingFace 完整模型仓库 (零猜测、零单文件 HTTP 404)
        run: |
          git clone https://huggingface.co/AngelSlim/Hy-MT2-1.8B-2Bit-GGUF ./hymt2_model

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate
          python -m pip install git+https://github.com/tencent/AngelSlim.git

      - name: 5. 加载本地克隆目录执行翻译
        run: |
          python -c "
          import torch
          import angelslim
          from transformers import AutoModelForCausalLM, AutoTokenizer

          model_path = './hymt2_model'
          print(f'=== 从本地克隆路径加载模型: {model_path} ===')

          model = AutoModelForCausalLM.from_pretrained(
              model_path,
              device_map='cpu',
              trust_remote_code=True,
              torch_dtype=torch.float32,
              low_cpu_mem_usage=True
          )
          tokenizer = AutoTokenizer.from_pretrained(model_path)

          prompt = 'Translate to Chinese: Hello, world!'
          inputs = tokenizer(prompt, return_tensors='pt')
          outputs = model.generate(**inputs, max_new_tokens=64)
          result = tokenizer.decode(outputs[0], skip_special_tokens=True)
          print('=== 翻译结果 ===')
          print(result)
          "
