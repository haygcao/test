name: Test Hy-MT2 Model (100% 遵照官方 README 规范测试)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-hymt2:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install official PyTorch & Transformers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.40.0" accelerate

      - name: 4. 100% 遵照官方 README 范例执行 Hy-MT2 1.8B 推理
        run: |
          python -c "
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          model_path = 'Tencent-Hunyuan/Hy-MT2-1.8B'
          print(f'=== 载入官方推荐 x86 模型: {model_path} ===')

          tokenizer = AutoTokenizer.from_pretrained(model_path, trust_remote_code=True)
          model = AutoModelForCausalLM.from_pretrained(
              model_path,
              torch_dtype=torch.float32,
              device_map='cpu',
              trust_remote_code=True,
              low_cpu_mem_usage=True
          )
          model.eval()

          # 100% 照搬官方 README Prompt 与 Chat Template 转换规范
          prompt = '将以下文本翻译成英语,注意只需要输出翻译后的结果,不要额外解释:\n\n今天天气真好。'
          messages = [{'role': 'user', 'content': prompt}]
          
          inputs = tokenizer.apply_chat_template(
              messages,
              add_generation_prompt=True,
              return_tensors='pt'
          ).to(model.device)

          with torch.no_grad():
              outputs = model.generate(
                  **inputs,
                  max_new_tokens=256,
              )

          response = tokenizer.decode(outputs[0][inputs['input_ids'].shape[-1]:], skip_special_tokens=True)
          print('=== 官方规范运行 翻译结果 ===')
          print(response)
          "
