name: Pipeline Full ARB Translate (AngelSlim Local 400MB)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pipeline-hymt2-arb:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout 测试仓库
        uses: actions/checkout@v4

      - name: 2. Git Clone HuggingFace 仓库到本地 ./hymt2_model (零 404/401 报错)
        run: |
          git clone https://huggingface.co/AngelSlim/HY-1.8B-2Bit ./hymt2_model

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 递归克隆 AngelSlim 源码并安装 (--recursive)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate
          git clone --recursive https://github.com/Tencent/AngelSlim.git /tmp/AngelSlim
          cd /tmp/AngelSlim && python -m pip install -e .

      - name: 5. 执行全量 ARB 本地化翻译管道 (AngelSlim 400MB)
        run: |
          python scripts/i18n_pipeline_local.py
