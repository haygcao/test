name: Slim Single Test

# 彻底注销，仅保留手动触发
on:
  workflow_dispatch:

jobs:
  slim-single-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Git Clone HuggingFace 400MB 仓库到本地 ./hymt2_model
        run: |
          git clone https://huggingface.co/AngelSlim/HY-1.8B-2Bit ./hymt2_model

      - name: 3. Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 遵照官方 README 递归克隆 AngelSlim 源码与依赖 (--recursive)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate
          git clone --recursive https://github.com/Tencent/AngelSlim.git /tmp/AngelSlim
          cd /tmp/AngelSlim && python -m pip install -e .

      - name: 5. 运行 AngelSlim 400MB 模型端侧翻译
        run: |
          python -c "
          import torch
          import angelslim
          from angelslim.engine import Engine
          from transformers import AutoTokenizer

          model_path = './hymt2_model'
          print(f'=== 从本地克隆目录载入 AngelSlim 400MB 模型: {model_path} ===')

          slim_engine = Engine()
          slim_engine.prepare_model(model_name='HunyuanDense', model_path=model_path)

          model = slim_engine.slim_model.model
          tokenizer = getattr(slim_engine.slim_model, 'tokenizer', None) or AutoTokenizer.from_pretrained(model_path)

          prompt = '将以下文本翻译成英语,注意只需要输出翻译后的结果,不要额外解释:\n\n今天天气真好。'
          messages = [{'role': 'user', 'content': prompt}]

          inputs = tokenizer.apply_chat_template(
              messages,
              add_generation_prompt=True,
              return_tensors='pt'
          ).to(model.device)

          with torch.no_grad():
              outputs = model.generate(
                  **inputs,
                  max_new_tokens=256,
              )

          response = tokenizer.decode(outputs[0][inputs['input_ids'].shape[-1]:], skip_special_tokens=True)
          print('=== AngelSlim 端侧翻译结果 ===')
          print(response)
          "
