name: Test Hy-MT2 Python Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-python-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install ollama

      - name: Install Ollama CLI
        run: |
          # 修复这里：加上 /install.sh
          curl -fsSL https://ollama.com | sh

      - name: Start Ollama Server & Pull Model
        run: |
          ollama serve > ollama.log 2>&1 &
          
          echo "Waiting for Ollama server to respond..."
          for i in {1..10}; do
            if curl -s http://localhost:11434 > /dev/null; then
              echo "Ollama server is up!"
              break
            fi
            sleep 2
          done
          
          echo "Pulling dzgg/Hy-MT2-1.8B-GGUF:1.25Bit..."
          ollama pull dzgg/Hy-MT2-1.8B-GGUF:1.25Bit

      - name: Run Inline Python Script
        run: |
          python - << 'EOF'
          from ollama import chat

          print("--- Starting Inference Request ---")
          response = chat(
              model='dzgg/Hy-MT2-1.8B-GGUF:1.25Bit',
              messages=[{'role': 'user', 'content': '将以下中文翻译为英文：人工智能正在改变我们的世界。'}],
          )
          
          print("\n--- Model Response ---")
          print(response.message.content)
          print("-----------------------")
          EOF
